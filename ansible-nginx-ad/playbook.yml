---
- name: Configurar servidores web NGINX con aplicacion AD
  hosts: webservers
  become: true

  vars:
    app_dir: /opt/redes-ad-web
    app_port: 8000

    ad_server_ip: "10.10.1.20"
    ad_domain: "redes.local"
    ad_base_dn: "DC=redes,DC=local"
    ad_bind_dn: "CN=ldapreader,CN=Users,DC=redes,DC=local"
    ad_bind_password: "Redes2026"

    cert_dir: /etc/nginx/ssl
    cert_file: /etc/nginx/ssl/redesproject.crt
    key_file: /etc/nginx/ssl/redesproject.key

  tasks:
    - name: Actualizar cache apt
      apt:
        update_cache: true

    - name: Instalar paquetes necesarios
      apt:
        name:
          - nginx
          - python3
          - python3-pip
          - python3-venv
          - openssl
          - netcat-openbsd
          - dnsutils
        state: present

    - name: Crear directorio de aplicacion
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Copiar archivos de aplicacion
      copy:
        src: "files/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: www-data
        group: www-data
        mode: "0644"
      loop:
        - app.py
        - requirements.txt
        - index.html
        - styles.css
        - script.js

    - name: Crear entorno virtual Python
      command: python3 -m venv "{{ app_dir }}/venv"
      args:
        creates: "{{ app_dir }}/venv/bin/activate"

    - name: Instalar dependencias Python
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"

    - name: Crear directorio SSL para NGINX
      file:
        path: "{{ cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generar certificado autofirmado con OpenSSL
      command: >
        openssl req -x509 -nodes -days 365
        -newkey rsa:2048
        -keyout {{ key_file }}
        -out {{ cert_file }}
        -subj "/C=CR/ST=Heredia/L=Heredia/O=RedesProject/OU=Web/CN={{ inventory_hostname }}"
      args:
        creates: "{{ cert_file }}"

    - name: Crear servicio systemd de la aplicacion Flask
      template:
        src: templates/redes-ad-web.service.j2
        dest: /etc/systemd/system/redes-ad-web.service
        owner: root
        group: root
        mode: "0644"

    - name: Recargar systemd
      systemd:
        daemon_reload: true

    - name: Habilitar y reiniciar aplicacion Flask
      systemd:
        name: redes-ad-web
        enabled: true
        state: restarted

    - name: Configurar sitio NGINX
      template:
        src: templates/nginx-site.conf.j2
        dest: /etc/nginx/sites-available/redes-ad-web
        owner: root
        group: root
        mode: "0644"

    - name: Habilitar sitio NGINX
      file:
        src: /etc/nginx/sites-available/redes-ad-web
        dest: /etc/nginx/sites-enabled/redes-ad-web
        state: link
        force: true

    - name: Eliminar sitio default de NGINX
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validar configuracion NGINX
      command: nginx -t

    - name: Reiniciar NGINX
      systemd:
        name: nginx
        enabled: true
        state: restarted