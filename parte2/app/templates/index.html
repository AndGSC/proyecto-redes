<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto Redes 2026</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 4rem auto; text-align: center; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 2rem; background: #f9f9f9; }
    .badge { background: #0078d4; color: #fff; border-radius: 4px; padding: 2px 10px; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hola desde la nube ☁️</h1>
    <p>Pod: <strong>{{ hostname }}</strong></p>
    <p><span class="badge">v{{ version }}</span></p>
  </div>
</body>
</html>
