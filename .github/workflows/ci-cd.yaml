name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'parte2/**'

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: mi-app

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
                       -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
                       ./parte2
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

  deploy:
    name: Deploy to Azure Container Instance
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to ACI
        run: |
          az container delete \
            --resource-group rg-proyecto-redes \
            --name mi-app-container \
            --yes || true
          az container create \
            --resource-group rg-proyecto-redes \
            --name mi-app-container \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/mi-app:${{ github.sha }} \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label mi-app-mariela2026 \
            --ports 5000 \
            --os-type Linux \
            --cpu 1 \
            --memory 1 \
            --location eastus