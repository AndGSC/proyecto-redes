<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto de redes - Andrey, Javier, Mariela, Paulina</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Proyecto de redes</h1>
            <p class="subtitle">Autenticación contra Active Directory</p>

            <div class="info">
                <strong>Servidor web:</strong>
                <span id="serverInfo">Cargando...</span>
            </div>

            <form id="loginForm">
                <label for="username">Usuario (con AD)</label>
                <input type="text" id="username" placeholder="usuario1" autocomplete="username" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>

                <button type="submit">Iniciar sesión</button>
            </form>

            <div id="message" class="message"></div>

            <button id="loadUsersBtn" class="secondary" disabled>
                Cargar usuarios de Active Directory
            </button>

            <section id="usersSection">
                <h2>Usuarios AD</h2>
                <ul id="usersList"></ul>
            </section>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
